name: Tests

# no permissions by default
permissions: {}

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest ]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Micromamba ${{ matrix.python-version }}
      uses: mamba-org/setup-micromamba@d6abac32e3a0d16ca7161790b7c20e0167cfdae8 # v3.2.0
      with:
        # Remove the line below when micromamba 2.6.2 is released.
        micromamba-version: '2.6.0-0'
        environment-name: TEST
        init-shell: bash
        create-args: >-
          python=${{ matrix.python-version }} pip
          --file requirements-dev.txt
          --channel conda-forge

    - name: Install on pyobis
      shell: bash -l {0}
      run: |
        python -m pip install -e . --force-reinstall

    - name: Run Unit Tests
      shell: bash -l {0}
      run: |
        # use --vcr-record=all when recording new cassettes. We never record on CIs though
        python -m pytest -rxs --cov=pyobis ./pyobis --vcr-record=none
