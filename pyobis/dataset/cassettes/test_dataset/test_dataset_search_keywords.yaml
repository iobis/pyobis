        ,\"title\":\"Acanthoplesiops naka. A new species of the fish genus Acanthoplesiops\
        \ Regan (Teleostei: Plesiopidae: Acanthoclininae) from Tonga\",\"citation\"\
        :\"Mooi, R.D. and Gill, A.C. (2004) Data from: Description of a new species\
        \ of the fish genus Acanthoplesiops Regan (Teleostei: Plesiopidae: Acanthoclininae)\
        \ from Tonga. Zootaxa 432: 1-29\\n\",\"citation_id\":null,\"abstract\":\"\
        Acanthoplesiops naka sp. n. is described from the 9.9 mm SL holotype collected\
        \ at Ofolanga Island of the Ha'apai Group of Tonga. Its dorsal-fin spine count\
        \ of XVIII is unique in the genus. The following combination of characters\
        \ also distinguishes it from congeners: first two dorsal-fin pterygiophores\
        \ in the 3rd interneural space (anterior dorsal-fin formula ?/?/I+I/I/I/I/I//I/I/I);\
        \ 3 dentary pores; 2 intertemporal pores; head and body generally brownish\
        \ with darker pigment spots (from shrunken melanophores), excepting a paler\
        \ stripe from the anterior half of the symphyseal flap on the lower lip to\
        \ the origin of the dorsal fin (continuing on to the first dorsal spine),\
        \ a pale spot on the pectoral-fin base, and a pale caudal peduncle continuous\
        \ with  pale bases of last 3 segmented dorsal- and anal-fin rays; regular\
        \ ctenoid scales; no membranous attachment of last dorsal- or anal-fin rays\
        \ to caudal fin. The new species might be the sister taxon to A. psilogaster\
        \ as they share the putative derived character of two dorsal-fin pterygiophores\
        \ in the 3rd interneural space. \",\"intellectualrights\":\"This work is licensed\
        \ under a  Creative Commons Attribution (CC-BY) 4.0 License\",\"feed\":{\"\
