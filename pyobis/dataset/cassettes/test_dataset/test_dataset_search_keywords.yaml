        Pacific Reef Assessment and Monitoring Program: Rapid Ecological Assessments\
        \ of Fish Large-Area Stationary Point Count Surveys (SPC) at Coral Reef Sites\
        \ across the Pacific Ocean from 2000 to 2007\",\"citation\":\"Coral Reef Ecosystem\
        \ Program; Pacific Islands Fisheries Science Center (2017). Pacific Reef Assessment\
        \ and Monitoring Program: Rapid Ecological Assessments of Fish Large-Area\
        \ Stationary Point Count Surveys (SPC) in the Pacific Ocean from 2000-09-09\
        \ to 2007-06-08 (NCEI Accession 0162466). NOAA National Centers for Environmental\
        \ Information. Dataset.\",\"citation_id\":\"https://accession.nodc.noaa.gov/0162466\"\
        ,\"abstract\":\"The large-area stationary point count (SPC) method was used\
        \ to conduct reef fish surveys in the Hawaiian and Mariana Archipelagos, American\
        \ Samoa, and the Pacific Remote Island Areas as part of NOAA's Pacific Reef\
        \ Assessment and Monitoring Program (Pacific RAMP). The SPC method catalogs\
        \ the diversity (species richness), abundance (numeric density) and biomass\
        \ (fish mass per unit area) of diurnally active reef fish assemblages in shallow-water\
        \ (typically 10-15m, always &lt; 30m) hard-bottom habitats.\\n\\nStationary\
        \ Point Counts (SPC) is one of several non-invasive underwater-survey methods\
        \ to enumerate the diverse components of diurnally active shallow-water reef\
        \ fish assemblages. At each REA survey sites, SPC fish surveys were conducted\
        \ at 4 stations in conjunction with, but at least 10 m away from 3 consecutively-placed,\
        \ 25m transect lines to quantify relatively larger (&gt;25 cm Total Length\
        \ [TL]) and more vagile fish species(BLT). All fishes &gt;25 cm TL are recorded\
        \ to species-level that enter a 20 m diameter cylinder (area ~314 m2) during\
        \ a timed 5 minute count. Individuals or groups are estimated to the nearest\
        \ 5 cm TL size-class bin. Four replicate, 5 minute cylinder counts are conducted\
        \ at each station. Care is taken to avoid over-counting large transient or\
        \ schooling species. Transects lines and stations are typically set at depths\
        \ of 10-15 m. Reef ledges and holes are visually searched. Stations are completed\
        \ on all sides of the island/atoll, weather and sea conditions permitting.\
        \ Raw survey data included species level abundance estimates.\",\"intellectualrights\"\
        :\"This work is licensed under a  Creative Commons Attribution (CC-BY) 4.0\
        \ License\",\"feed\":{\"id\":\"8112d75b-7e78-4641-9e09-9a2cc7db7375\",\"url\"\
