        \ entremar\xE9s e de \xE1guas rasas do Brasil. Na d\xE9cada de 1980, houve\
        \ grande interc\xE2mbio de exemplares de octocorais intermediado principalmente\
        \ com a Smithsonian Institution (EUA) pelo Dr. Clovis Barreira e Castro, ganhando\
        \ representa\xE7\xE3o caribeana. Com o trabalho de \xE2mbito mundial sobre\
        \ cnidoma na ordem Scleractinia, realizado pela Dra. D\xE9bora de Oliveira\
        \ Pires na primeira metade da d\xE9cada de 1990, a cole\xE7\xE3o ganhou representatividade\
        \ de praticamente todas as fam\xEDlias da ordem, com material fixado com tecido,\
        \ o que \xE9 raro para este grupo taxon\xF4mico, e oriundo principalmente\
        \ do Rijksmuseum (Holanda) e de novas coletas. A partir de meados da d\xE9\
        cada de 1990, a cole\xE7\xE3o ganhou forte representatividade de materiais\
        \ da plataforma e talude continental brasileiro, a partir de amostras recebidas\
        \ do Programa Recursos Vivos da Zona Econ\xF4mica Exclusiva (REVIZEE - Scores\
        \ Central e Sul, compreendendo as \xE1reas entre Salvador e o extremo sul\
        \ do Brasil), do Programa de Observadores de Bordo em Embarca\xE7\xF5es Arrendadas\
        \ (PROA - UNIVALI), do Projeto de Caracteriza\xE7\xE3o Ambiental Regional\
        \ da Bacia de Campos (PCR-BC - Petrobras) e outros. Trata-se hoje de uma das\
        \ melhores cole\xE7\xF5es de mar profundo do grupo em todo o mundo.\",\"intellectualrights\"\
