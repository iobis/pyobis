        \ to 2015-09-25. United States Geological Survey. Sampling event dataset https://doi.org/10.15468/949wfb\
        \ \",\"citation_id\":null,\"abstract\":\"Invertebrate census data were collected\
        \ from sites around Micronesia as part of the ongoing Micronesia Challenge.\
        \ Information on the program can be found at (www.micronesiareefmonitoring.com).\
