        Register of Marine Species","type":"Partnerships","type_other":"Projects","description":"The
        aim of a World Register of Marine Species (WoRMS) is to provide an authoritative
        and comprehensive list of names of marine organisms, including information
        on synonymy. While the highest priority goes to valid names, other names in
        use are included so that this register can serve as a guide to interpret taxonomic
        literature.","url":"http://www.marinespecies.org","startdate":null,"enddate":null,"logo":null,"contributions":[{"node_id":"4bf79a01-65a9-4db6-b37b-18434f26ddfc","node":"EurOBIS","other_contributor":null,"funding":[],"funding_source":[]},{"node_id":"dc6c6ea2-83f5-4b18-985a-9efff6320d69","node":"Antarctic
