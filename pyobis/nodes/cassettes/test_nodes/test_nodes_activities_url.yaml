        Belgium","type":"Partnerships","type_other":null,"description":"LifeWatch
        was established as part of the European Strategy Forum on Research Infrastructure
        (ESFRI) and can be seen as a virtual laboratory for biodiversity research.
        The concept behind LifeWatch was developed in the 1990s and early 2000s, with
        the support of EU Networks of Excellence related to biodiversity and ecosystem
        functioning. This - amongst others - included the MarBEF project, which was
        the driving project behind the creation of both the European node of the Ocean
        Biogeographic Information System (EurOBIS) and European Register of Marine
        Species (ERMS) - the predecessor of the World Register of Marine Species (WoRMS).\n\nBelgium
        contributes to LifeWatch with varied and complementary \"in-kind\" contributions.
        These are implemented under the form of long lasting projects by different
        research centers and universities spread over the country and supported by
        each respective political authority. Within LifeWatch, the Flanders Marine
        Institute - host of the European node of the Ocean Biogeographic Information
        System (EurOBIS) and the World Register of Marine Species (WoRMS) - has taken
        on the responsibility to develop the LifeWatch Species Information Backbone
        (LW-SIBb). This Backbone also includes OBIS, allowing people to combine services
        spanning e.g. WoRMS & OBIS in one go.","url":"http://www.lifewatch.be/","startdate":null,"enddate":null,"logo":null,"contributions":[{"node_id":"4bf79a01-65a9-4db6-b37b-18434f26ddfc","node":"EurOBIS","other_contributor":null,"funding":[],"funding_source":[]},{"node_id":"dc6c6ea2-83f5-4b18-985a-9efff6320d69","node":"Antarctic
