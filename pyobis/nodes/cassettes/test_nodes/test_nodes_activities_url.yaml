        Marine Observation and Data Network (EMODnet) - Biology","type":"Other","type_other":"Projects","description":"The
        European Marine Data and Observation Network (EMODnet) aims to develop a system
        to make marine data available in support of scientists, policy makers and
        other end-users, within the framework of the new European maritime policy.
        VLIZ coordinates the biology lot, with 24 European partners and develops an
        online data portal. EMODNet Biology contributes to EurOBIS. EMODnet is currently
        in its third phase.\n","url":"http://www.emodnet-biology.eu/","startdate":"2017-04-17T00:00:00.000Z","enddate":"2019-04-16T00:00:00.000Z","logo":null,"contributions":[{"node_id":"4bf79a01-65a9-4db6-b37b-18434f26ddfc","node":"EurOBIS","other_contributor":null,"funding":[],"funding_source":[]},{"node_id":"310922b4-9d0c-4de1-92d7-9b442d34765b","node":"OBIS
