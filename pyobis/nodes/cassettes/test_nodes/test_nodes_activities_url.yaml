        OBIS with environmental data (OBIS-ENV-DATA)","type":"Other","type_other":"Projects","description":"The
        main objectives of the project \"Expanding OBIS with environmental data\"
        were (i) to ensure mixed data sets stay together, (ii) to demonstrate that
        OBIS nodes, NODCs and ADUs, that hold mixed data sets, can collaborate on
        the joint management and exchange of biodiversity observation data including
        environmental measurements, and (iii) to show what the benefit of this approach
